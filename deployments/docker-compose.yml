services:
  cineye:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        VERSION: ${SURVEILLANCE_VERSION:-latest}
    image: cineye:latest
    container_name: cineye
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - cineye-data:/app/data
      - cineye-recordings:/app/recordings
      - cineye-logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - SURVEILLANCE_SERVER_MODE=release
      - SURVEILLANCE_DATABASE_TYPE=sqlite
      - SURVEILLANCE_STORAGE_LOCAL_ROOT_PATH=/app/recordings
      - CINEYE_LOGGING_OUTPUT=/app/logs/cineye.log
    networks:
      - cineye-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  minio:
    profiles: ["minio"]
    image: minio/minio:latest
    container_name: cineye-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    networks:
      - cineye-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    profiles: ["nginx"]
    image: nginx:alpine
    container_name: cineye-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - cineye
    networks:
      - cineye-net

networks:
  cineye-net:
    driver: bridge

volumes:
  cineye-data:
  cineye-recordings:
  cineye-logs:
  minio-data:
